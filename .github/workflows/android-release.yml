name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy website into the app
        run: npm run prepare-www

      - name: Create Android project and icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          CODE=$(( $(git rev-list --count HEAD) ))
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle

      - name: Check signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "present=$([ -n "$KS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build release APK (signed)
        if: steps.key.outputs.present == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android && ./gradlew assembleRelease --no-daemon
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:${KEY_PASS:-$KS_PASS}" \
            --out "$GITHUB_WORKSPACE/StatSphere.apk" "$RUNNER_TEMP/aligned.apk"

      - name: Build debug-signed APK (no key set up)
        if: steps.key.outputs.present != 'true'
        run: |
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/StatSphere.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StatSphere-apk
          path: StatSphere.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StatSphere.apk
          generate_release_notes: true
